<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>SciConvert</title>
</head>
<body>
    <div id="app"></div>
    <script type="module">
        const local = './src/', remote = 'https://lsparrish.github.io/sciconvert/src/', v = `?v=${Date.now()}`;
        
        async function load() {
            // Determine source once
            const base = await fetch(`${local}app.js`, {method:'HEAD'}).then(r => r.ok ? local : remote).catch(() => remote);

            try {
                // 1. Setup global assets required by app.js internal bootstrap
                const img = await import(`${base}sampleImage.js${v}`);
                window.embeddedDefaultImage = img.default;

                // 2. Import app.js (it self-bootstraps internally via its own async IIFE)
                const { default: app } = await import(`${base}app.js${v}`);
                window.app = app;

                // 3. Optional: Initialize audit engine after a short render delay
                const { TestEngine } = await import(`${base}unitTestEngine.js${v}`);
                setTimeout(() => new TestEngine(app).run(), 500);
                
            } catch (e) {
                document.body.innerHTML = `<pre style="color:red;padding:20px">Load Error: ${e.message}</pre>`;
            }
        }
        load();
    </script>
</body>
</html>
